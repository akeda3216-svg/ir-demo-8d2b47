<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>tea room IRiS｜西宮・五月ヶ丘の喫茶室</title>
<meta name="description" content="西宮市五月ヶ丘のカフェ tea room IRiS（ティールームイリス）。器と本と、あたたかいお茶と。水曜定休、10時〜19時。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c140f; --cream:#f5e9d4; --amber:#e0a458; --amber2:#f3c27e; --sub:#cdb89a;
  --demo:38px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--cream);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.85;letter-spacing:.04em;overflow-x:hidden}
a{color:inherit}
.demo{background:#000;color:#e9dcc6;font-size:12px;line-height:1.6;text-align:center;padding:8px 12px;min-height:var(--demo)}

/* ===== トップ：暗い喫茶室に、灯りを動かして照らす ===== */
.hero{position:relative;overflow:hidden;height:calc(100svh - var(--demo));min-height:560px;background:var(--bg);cursor:crosshair;touch-action:pan-y;--lx:62vw;--ly:46vh;--r1:130px;--r2:340px}
.bg{position:absolute;inset:0;background:url(assets/bg_l.jpg) 50% 50%/cover no-repeat;animation:kb 40s ease-in-out infinite alternate;transform-origin:50% 60%}
.bg.dim{filter:brightness(.16) saturate(.6) contrast(1.05)}
.bg.lit{filter:brightness(1.08) saturate(1.05);-webkit-mask-image:radial-gradient(circle at var(--lx) var(--ly),#000 0,rgba(0,0,0,.92) var(--r1),transparent var(--r2));mask-image:radial-gradient(circle at var(--lx) var(--ly),#000 0,rgba(0,0,0,.92) var(--r1),transparent var(--r2))}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.1)}}
@media(max-aspect-ratio:1/1){.bg{background-image:url(assets/bg_p.jpg)}.hero{--r1:100px;--r2:270px}}
.glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle at var(--lx) var(--ly),rgba(255,176,90,.30) 0,rgba(255,150,60,.10) 22%,transparent 46%)}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(8,4,2,.55) 100%)}

/* 湯気 */
.steam{position:absolute;width:90px;height:150px;pointer-events:none;transform:translate(-50%,-100%)}
.steam i{position:absolute;bottom:0;left:50%;width:34px;height:90px;margin-left:-17px;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,rgba(255,244,226,.55),rgba(255,244,226,0) 70%);filter:blur(7px);opacity:0;animation:rise 6s ease-in infinite}
.steam i:nth-child(2){animation-delay:-2s;margin-left:-30px}
.steam i:nth-child(3){animation-delay:-4s;margin-left:2px}
@keyframes rise{0%{opacity:0;transform:translateY(0) scaleX(.8)}18%{opacity:.7}100%{opacity:0;transform:translateY(-120px) scaleX(1.5) rotate(6deg)}}

/* 縦書きの言葉（上から墨が流れるように現れる） */
.vtxt{position:absolute;z-index:5;right:clamp(28px,8vw,150px);top:clamp(46px,12vh,120px);display:flex;flex-direction:row-reverse;gap:clamp(14px,2vw,30px);height:clamp(240px,62vh,560px);pointer-events:none}
.col{writing-mode:vertical-rl;text-orientation:mixed;font-family:"Shippori Mincho",serif;font-weight:500;font-size:clamp(23px,3.1vw,44px);line-height:1.9;letter-spacing:.24em;color:var(--cream);text-shadow:0 0 14px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.8);
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 45%,transparent 62%);mask-image:linear-gradient(to bottom,#000 0,#000 45%,transparent 62%);-webkit-mask-size:100% 260%;mask-size:100% 260%;-webkit-mask-position:0 100%;mask-position:0 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.col.c2{font-size:clamp(17px,2.2vw,30px);padding-top:3em;color:var(--amber2)}
.anim .col{animation:ink 3.2s cubic-bezier(.3,.2,.2,1) forwards}
.anim .col.c2{animation-delay:1.1s}
.noanim .col{-webkit-mask-position:0 0;mask-position:0 0}
@keyframes ink{to{-webkit-mask-position:0 0;mask-position:0 0}}

/* 店名・情報・ボタン */
.bottom{position:absolute;z-index:6;left:clamp(24px,6vw,110px);bottom:clamp(26px,7vh,70px);max-width:560px}
.brand{font-family:"Cormorant Garamond",serif;font-weight:600;font-style:italic;font-size:clamp(40px,5.6vw,76px);line-height:1.05;letter-spacing:.04em;color:var(--cream);text-shadow:0 2px 18px rgba(0,0,0,.7)}
.brand small{display:block;font-family:"Shippori Mincho",serif;font-style:normal;font-weight:500;font-size:clamp(12px,1.2vw,15px);letter-spacing:.34em;color:var(--sub);margin-top:6px}
.info{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 18px;font-size:14px;color:var(--cream);text-shadow:0 1px 10px rgba(0,0,0,.8)}
.info span{position:relative;padding-left:14px}
.info span::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:12px 28px;background:var(--amber);color:#2a1a0c;text-decoration:none;font-weight:700;font-size:15px;letter-spacing:.08em;border-radius:999px;box-shadow:0 10px 28px rgba(224,164,88,.35);transition:transform .25s,box-shadow .25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(224,164,88,.5)}
.cta:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.cta::after{content:"→"}
.sub-links{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px}
.sub-links a{color:var(--sub);text-decoration:none;border-bottom:1px solid rgba(205,184,154,.4);padding-bottom:1px;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.sub-links a:hover{color:var(--cream)}
.hint{position:absolute;z-index:7;left:clamp(24px,6vw,110px);top:18px;font-size:12.5px;color:var(--sub);letter-spacing:.14em;display:flex;align-items:center;gap:8px;transition:opacity .8s}
.hint::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber2);box-shadow:0 0 12px 3px rgba(243,194,126,.7);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.hint.gone{opacity:0}
.ai{position:absolute;z-index:7;right:14px;bottom:10px;font-size:11px;color:#cbb79a;background:rgba(0,0,0,.45);padding:2px 10px;border-radius:999px}

/* スマホ：縦書きを右上、店名と案内を下にして、一画面に */
@media(max-width:700px){
  .hero{min-height:0}
  .vtxt{right:20px;top:46px;height:min(46svh,360px);gap:12px}
  .col{font-size:23px;letter-spacing:.2em}
  .col.c2{font-size:17px;padding-top:2.2em}
  .bottom{left:20px;right:20px;bottom:18px;max-width:none}
  .brand{font-size:44px}
  .info{margin:10px 0 12px;font-size:12.5px;gap:4px 14px}
  .cta{width:100%;min-height:50px;padding:10px 20px;font-size:14.5px}
  .sub-links{margin-top:10px;font-size:12.5px}
  .hint{left:20px;top:14px;font-size:11.5px}
  .ai{display:none}
}
@media(prefers-reduced-motion:reduce){
  .bg{animation:none}
  .steam i{animation:none;opacity:.25}
  .hint::before{animation:none}
}
</style>
</head>
<body>
<div class="demo">これはtea room IRiS様向けに作ったデモ（トップページのみ・非公開の見本）です。内容はInstagramの公開情報をもとにしています。</div>

<main>
<section class="hero" id="hero" aria-label="tea room IRiS トップ">
  <div class="bg dim" aria-hidden="true"></div>
  <div class="bg lit" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="vig" aria-hidden="true"></div>
  <div class="steam" id="steam" aria-hidden="true"><i></i><i></i><i></i></div>

  <p class="hint" id="hint">灯りを動かして、のぞいてみてください</p>

  <h1 class="vtxt" aria-label="ひとやすみ、器と本と、お茶と。">
    <span class="col c1" aria-hidden="true">ひとやすみ、</span>
    <span class="col c2" aria-hidden="true">器と本と、お茶と。</span>
  </h1>

  <div class="bottom">
    <p class="brand">tea room IRiS<small>ティールーム　イリス　｜　西宮・五月ヶ丘</small></p>
    <div class="info"><span>水曜定休</span><span>10:00 – 19:00</span><span>0798-71-9664</span></div>
    <a class="cta" id="cta" href="https://www.instagram.com/tea_room_iris/" target="_blank" rel="noopener">今月の営業日を見る</a>
    <div class="sub-links"><a href="https://www.google.com/maps/search/?api=1&query=%E5%85%B5%E5%BA%AB%E7%9C%8C%E8%A5%BF%E5%AE%AE%E5%B8%82%E4%BA%94%E6%9C%88%E3%82%B1%E4%B8%98%EF%BC%94%E2%88%92%EF%BC%91%EF%BC%92" target="_blank" rel="noopener">道順（Googleマップ）</a><a href="tel:0798719664">電話する</a></div>
  </div>
  <p class="ai">※ 写真はイメージ（AI生成）です。店内の実際の写真ではありません</p>
</section>
</main>

<script>
(function(){
  var root=document.documentElement, hero=document.getElementById("hero");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var visible=document.visibilityState==="visible";

  /* 縦書きの言葉：フォントが読み込まれてから、上から流れるように現れる */
  var started=false,go=function(){if(started)return;started=true;root.classList.add(reduce||!visible?"noanim":"anim")};
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(go);setTimeout(go,1800)}else{go()}

  /* 画像の中の、カップ（湯気の位置）とランプの位置（画像に対する割合） */
  var spots={l:{w:1408,h:768,cup:[.44,.74],lamp:[.63,.50]},p:{w:848,h:1264,cup:[.33,.72],lamp:[.40,.50]}};
  function mode(){return window.matchMedia("(max-aspect-ratio: 1/1)").matches?"p":"l"}
  function toScreen(frac){
    var s=spots[mode()],W=hero.clientWidth,H=hero.clientHeight,sc=Math.max(W/s.w,H/s.h);
    return [(W-s.w*sc)/2+frac[0]*s.w*sc,(H-s.h*sc)/2+frac[1]*s.h*sc];
  }
  var steam=document.getElementById("steam");
  function placeSteam(){var p=toScreen(spots[mode()].cup);steam.style.left=p[0]+"px";steam.style.top=(p[1]-6)+"px"}
  placeSteam();window.addEventListener("resize",placeSteam);

  /* 灯り：さわる／マウスで動かすと、そこが明るくなる。操作がないときは、ゆっくり部屋をめぐる */
  var hint=document.getElementById("hint");
  var W=hero.clientWidth,H=hero.clientHeight;
  var lamp=toScreen(spots[mode()].lamp);
  var cur={x:lamp[0],y:lamp[1]},tgt={x:cur.x,y:cur.y},lastUse=-1e9,t0=performance.now(),used=false;
  function setVars(){hero.style.setProperty("--lx",cur.x+"px");hero.style.setProperty("--ly",cur.y+"px")}
  setVars();
  function aim(e){
    var r=hero.getBoundingClientRect();
    tgt.x=e.clientX-r.left;tgt.y=e.clientY-r.top;lastUse=performance.now();
    if(!used){used=true;hint.classList.add("gone")}
  }
  hero.addEventListener("pointermove",aim);
  hero.addEventListener("pointerdown",aim);
  if(!reduce){
    var loop=function(now){
      var W2=hero.clientWidth,H2=hero.clientHeight;
      if(now-lastUse>3500){
        var t=(now-t0)/1000;
        tgt.x=W2*(.5+.34*Math.sin(t*.22));
        tgt.y=H2*(.55+.22*Math.sin(t*.31+1.2));
      }
      cur.x+=(tgt.x-cur.x)*.06;cur.y+=(tgt.y-cur.y)*.06;
      setVars();requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    setTimeout(function(){hint.classList.add("gone")},14000);
  }
})();
</script>
</body>
</html>
